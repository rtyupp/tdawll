services:
  - type: web
    name: spy-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEEPSEEK_API_KEY
        sync: false          # سرّي: أضف قيمته من لوحة Render (لا يُخزَّن في المستودع)
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
