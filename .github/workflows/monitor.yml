name: SPY 15m Monitor

on:
  schedule:
    # يعمل كل دقيقة خلال أوقات السوق الأمريكي
    # 13:30 إلى 22:00 UTC = 4:30 مساءً إلى 1:00 صباحاً بتوقيت الخليج
    - cron: '* 13-22 * * 0-4'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Monitor
        run: python spy_monitor.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_CONFIDENCE: '75'
